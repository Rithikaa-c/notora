<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notora | Welcome</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            width: 100%;
        }

        /* FULL BACKGROUND IMAGE */
        .welcome-container {
            height: 100vh;
            width: 100%;
            background: url("/images/welcome.png") no-repeat center center;
            background-size: cover;
            position: relative;
        }

        /* GET STARTED BUTTON */
        .get-started {
            position: absolute;
            left: 4.5%;
            bottom: 40%;

            padding: 18px 50px;
            font-size: 24px;
            font-weight: 850;

            border: none;
            border-radius: 22px;
            cursor: pointer;

            color: white;
            background: linear-gradient(135deg, #f472b6, #fb7185);

            text-decoration: none;
            box-shadow: 0 16px 40px rgba(244,114,182,0.45);
            transition: all 0.3s ease;
        }

        .get-started:hover {
            transform: translateY(-6px);
            box-shadow: 0 22px 55px rgba(244,114,182,0.6);
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 768px) {
            .get-started {
                left: 50%;
                transform: translateX(-50%);
                bottom: 18%;
                font-size: 18px;
                padding: 14px 40px;
            }
        }
    </style>
</head>

<body>

<div class="welcome-container">

    <!-- ONLY ONE BUTTON -->
    <a th:href="@{/choose}" class="get-started">
        Get Started →
    </a>

</div>

</body>
</html>
