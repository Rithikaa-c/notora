<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notora | Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #fadadd, #fdb7b9);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-wrapper {
            width: 95%;
            max-width: 1100px;
            height: 650px;
            background: #fff;
            border-radius: 28px;
            display: flex;
            box-shadow: 0 25px 60px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .left-section {
            flex: 1;
            background: linear-gradient(135deg, #fadadd, #fdb7b9);
        }

        .left-section img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .right-section {
            flex: 1;
            padding: 50px 55px;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h3 {
            font-size: 30px;
            font-weight: 800;
            color: #3a2e39;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 15px;
            color: #6b7280;
            margin-bottom: 20px;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group i {
            position: absolute;
            top: 50%;
            left: 18px;
            transform: translateY(-50%);
            color: #f472b6;
            font-size: 16px;
        }

        .input-group input {
            width: 90%;
            padding: 14px 18px 14px 45px;
            border-radius: 14px;
            border: 1.5px solid #fbcfe8;
            font-size: 15px;
            outline: none;
            background: #fff7f3;
        }

        .terms {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            margin: 10px 0 22px;
            color: #3a2e39;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #f472b6, #fb7185);
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-link {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .login-link a {
            color: #f472b6;
            font-weight: 700;
            text-decoration: none;
        }

        @media (max-width: 900px) {
            .register-wrapper {
                flex-direction: column;
                height: auto;
            }
            .left-section {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="register-wrapper">

    <div class="left-section">
        <img src="/images/imageregister.png" alt="Register Illustration">
    </div>

    <div class="right-section">

        <h3>Create Your Account</h3>
        <div class="subtitle">Sign up to start sharing smart notes!</div>

        <div class="error" th:if="${param.error != null}">
    <span th:if="${param.error[0] == 'email'}">
        Email already exists. Please login.
    </span>
        </div>

        <!-- ✅ JS VALIDATION ERROR -->
        <div id="errorMsg" class="error"></div>

        <form action="/register" method="post" onsubmit="return validateForm()">

            <div class="input-group">
                <i class="fa fa-user"></i>
                <input type="text" id="fullname" name="fullname" placeholder="Full Name">
            </div>

            <div class="input-group">
                <i class="fa fa-envelope"></i>
                <input type="email" id="email" name="email" placeholder="Email Address">
            </div>

            <div class="input-group">
                <i class="fa fa-lock"></i>
                <input type="password" id="password" name="password" placeholder="Create Password">
            </div>

            <div class="input-group">
                <i class="fa fa-lock"></i>
                <input type="password" id="confirmPassword" placeholder="Confirm Password">
            </div>

            <div class="terms">
                <input type="checkbox" id="terms">
                <label for="terms">I agree to the Terms & Conditions</label>
            </div>

            <button type="submit" class="btn-submit">Sign Up</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="/login">Log In</a>
        </div>
    </div>
</div>

<script>
    function validateForm() {
        const name = document.getElementById("fullname").value.trim();
        const email = document.getElementById("email").value.trim();
        const pass = document.getElementById("password").value;
        const confirm = document.getElementById("confirmPassword").value;
        const terms = document.getElementById("terms").checked;
        const error = document.getElementById("errorMsg");

        error.innerText = "";

        const nameRegex = /^[A-Za-z ]+$/;
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const passwordRegex = /^(?=.*[0-9])(?=.*[!@#$%^&*])[A-Za-z0-9!@#$%^&*]{8,}$/;

        if (!nameRegex.test(name)) {
            error.innerText = "Full Name should contain only letters and spaces.";
            return false;
        }

        if (!emailRegex.test(email)) {
            error.innerText = "Please enter a valid email address.";
            return false;
        }

        if (!passwordRegex.test(pass)) {
            error.innerText =
                "Password must be at least 8 characters and include 1 number & 1 special character.";
            return false;
        }

        if (pass !== confirm) {
            error.innerText = "Passwords do not match.";
            return false;
        }

        if (!terms) {
            error.innerText = "You must agree to the Terms & Conditions.";
            return false;
        }

        return true; // submit to backend
    }
</script>

</body>
</html>
