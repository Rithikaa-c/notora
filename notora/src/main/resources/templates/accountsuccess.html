<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notora | Account Success</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #fadadd, #fdb7b9);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-wrapper {
            width: 95%;
            max-width: 1100px;
            height: 520px;
            background: #fff;
            border-radius: 28px;
            display: flex;
            box-shadow: 0 25px 60px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        /* LEFT IMAGE SECTION */
        .left-section {
            flex: 1;
            background: linear-gradient(135deg, #fadadd, #fdb7b9);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .left-section img {
            width: 98%;
            height: auto;
        }

        /* RIGHT CONTENT */
        .right-section {
            flex: 1;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            font-size: 36px;
            font-weight: 800;
            color: #f472b6;
            margin-bottom: 16px;
        }

        p {
            font-size: 16px;
            color: #6b7280;
            margin-bottom: 36px;
            line-height: 1.6;
        }

        .login-btn {
            width: 240px;
            padding: 14px;
            border-radius: 18px;
            border: none;
            background: linear-gradient(135deg, #f472b6, #fb7185);
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 14px 35px rgba(244,114,182,0.45);
            text-decoration: none;
            text-align: center;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 45px rgba(244,114,182,0.6);
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .success-wrapper {
                flex-direction: column;
                height: auto;
            }

            .left-section {
                display: none;
            }

            .right-section {
                text-align: center;
                align-items: center;
            }
        }
    </style>
</head>

<body>

<div class="success-wrapper">

    <!-- LEFT IMAGE -->
    <div class="left-section">
        <img src="/images/success.png" alt="Account Success">
    </div>

    <!-- RIGHT CONTENT -->
    <div class="right-section">
        <h1>Account Successfully Created!</h1>
        <p>
            Your account has been successfully created.<br>
            You can now log in and start sharing smart notes!
        </p>

        <!-- LOGIN BUTTON -->
        <a href="/login" class="login-btn">Login</a>
    </div>

</div>

</body>
</html>
