<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notora | Choose</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #fadadd, #fdb7b9);
            height: 100vh;
            overflow: hidden; /* 🚫 NO SCROLL */
            color: #3a2e39;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .header {
            height: 80px;
            padding: 0 70px;
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(14px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            font-size: 26px;
            font-weight: 800;
            color: #f472b6;
            flex-shrink: 0;
        }

        /* MAIN CONTAINER */
        .choose-container {
            flex: 1;
            margin: 25px auto;
            width: 92%;
            max-width: 1300px;
            background: rgba(255,255,255,0.35);
            border-radius: 28px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.15);
        }

        /* LEFT IMAGE FULL HEIGHT */
        .left-image {
            flex: 1;
        }

        .left-image img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 🔥 TOP TO BOTTOM */
        }

        /* RIGHT CONTENT */
        .right-content {
            flex: 1;
            padding: 30px 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
        }

        .title {
            font-size: 32px;
            font-weight: 800;
            color: #f472b6;
            margin-bottom: 10px;
        }

        /* SMALL CARDS */
        .choose-card {
            width: 100%;
            max-width: 340px;
            background: white;
            border-radius: 20px;
            padding: 6px 18px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            transition: 0.3s ease;
        }

        .choose-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 40px rgba(0,0,0,0.18);
        }

        .choose-card h3 {
            font-size: 22px;
            font-weight: 800;
            color: #f472b6;
            margin-bottom: 8px;
        }

        .choose-card p {
            font-size: 14px;
            opacity: 0.85;
            margin-bottom: 16px;
        }

        /* BUTTON */
        .choose-btn {
            padding: 10px 32px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #f472b6, #fb7185);
            color: white;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 10px 25px rgba(244,114,182,0.45);
            transition: 0.25s ease;
        }

        .choose-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 35px rgba(244,114,182,0.6);
        }

        /* MOBILE */
        @media (max-width: 900px) {
            body {
                overflow: auto;
            }

            .choose-container {
                flex-direction: column;
                height: auto;
            }

            .left-image {
                height: 260px;
            }

            .right-content {
                padding: 35px;
            }
        }
    </style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    Notora – Choose Your Access
</div>

<!-- MAIN FIXED CONTAINER -->
<div class="choose-container">

    <!-- LEFT IMAGE -->
    <div class="left-image">
        <img th:src="@{/images/choose.png}" alt="Choose Illustration">
    </div>

    <!-- RIGHT OPTIONS -->
    <div class="right-content">



        <!-- USER LOGIN -->
        <div class="choose-card">
            <h3>User Login</h3>
            <p>
                Access your account to upload, download,
                and manage your study notes.
            </p>
            <a th:href="@{/login}" class="choose-btn">Login</a>
        </div>

        <!-- REGISTER -->
        <div class="choose-card">
            <h3>Register</h3>
            <p>
                Create a new account and start sharing
                and exploring academic notes.
            </p>
            <a th:href="@{/register}" class="choose-btn">Create</a>
        </div>

        <!-- ADMIN LOGIN -->
        <div class="choose-card">
            <h3>Admin Login</h3>
            <p>
                Admin access to manage users,
                notes, and platform activity.
            </p>
            <a th:href="@{/admin/login}" class="choose-btn">Login</a>
        </div>

    </div>
</div>

</body>
</html>
