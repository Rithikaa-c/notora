<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Preview | Notora</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #fdf2f8;
            padding: 20px;
        }
        .viewer {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,.1);
        }
        iframe, img {
            width: 100%;
            height: 80vh;
            border-radius: 12px;
            border: none;
        }
    </style>
</head>
<body>

<h2 th:text="${note.subject}"></h2>
<p>
    Uploaded by
    <b th:text="${note.user.fullName}"></b>
</p>

<div class="viewer">

    <!-- PDF -->
    <iframe th:if="${note.fileType == 'application/pdf'}"
            th:src="@{/preview-file/{id}(id=${note.id})}">
    </iframe>

    <!-- Image -->
    <img th:if="${note.fileType.startsWith('image/')}"
         th:src="@{/preview-file/{id}(id=${note.id})}" />

    <!-- Text -->
    <iframe th:if="${note.fileType == 'text/plain'}"
            th:src="@{/preview-file/{id}(id=${note.id})}">
    </iframe>

    <!-- Fallback -->
    <p th:if="${!(note.fileType == 'application/pdf'
        or note.fileType.startsWith('image/')
        or note.fileType == 'text/plain')}">
        Preview not supported. Please download the file.
    </p>

</div>

</body>
</html>
