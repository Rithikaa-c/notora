<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notora | OTP Verification</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #fadadd, #fdb7b9);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .otp-wrapper {
            width: 95%;
            max-width: 1000px;
            height: 500px;
            background: #fff;
            border-radius: 26px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,0.2);
        }

        .left {
            flex: 1;
            background: linear-gradient(135deg, #fadadd, #fdb7b9);
        }

        .left img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .right {
            flex: 1;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h2 {
            font-size: 32px;
            font-weight: 800;
            color: #3a2e39;
        }

        p {
            color: #6b7280;
            margin: 12px 0 20px;
        }

        .otp-inputs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .otp-inputs input {
            width: 55px;
            height: 55px;
            text-align: center;
            font-size: 22px;
            border-radius: 12px;
            border: 1.5px solid #fbcfe8;
            outline: none;
        }

        .otp-inputs input:focus {
            border-color: #f472b6;
        }

        .btn {
            padding: 14px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #f472b6, #fb7185);
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 14px 35px rgba(244,114,182,0.45);
        }

        .error {
            color: red;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .timer {
            font-size: 14px;
            margin-top: 10px;
            color: #6b7280;
        }

        .resend {
            margin-top: 18px;
            font-size: 14px;
        }

        .resend button {
            background: none;
            border: none;
            color: #f472b6;
            font-weight: 700;
            cursor: pointer;
            padding: 0;
        }

        .resend button:disabled {
            color: #aaa;
            cursor: not-allowed;
        }

        @media (max-width: 900px) {
            .otp-wrapper {
                flex-direction: column;
                height: auto;
            }
            .left {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="otp-wrapper">

    <div class="left">
        <img src="/images/otpimage.png" alt="OTP Illustration">
    </div>

    <div class="right">

        <h2>OTP Verification</h2>
        <p>Enter the 6-digit verification code sent to your email.</p>

        <!-- BACKEND ERROR -->
        <div class="error" th:text="${error}"></div>

        <!-- VERIFY OTP FORM -->
        <form action="/verify-otp" method="post" onsubmit="return submitOtp()">

            <div class="otp-inputs">
                <input maxlength="1" class="otp-box" autofocus>
                <input maxlength="1" class="otp-box">
                <input maxlength="1" class="otp-box">
                <input maxlength="1" class="otp-box">
                <input maxlength="1" class="otp-box">
                <input maxlength="1" class="otp-box">
            </div>

            <!-- COMBINED OTP -->
            <input type="hidden" name="otp" id="otp">

            <button class="btn" type="submit">Verify</button>
        </form>

        <!-- TIMER -->
        <div class="timer">
            Resend OTP in <span id="time">02:00</span>
        </div>

        <!-- RESEND OTP -->
        <form action="/resend-otp" method="post" class="resend">
            <button id="resendBtn" disabled>Resend OTP</button>
        </form>

    </div>

</div>

<script>
    const inputs = document.querySelectorAll(".otp-box");
    const otpHidden = document.getElementById("otp");

    // AUTO MOVE + BACKSPACE
    inputs.forEach((input, index) => {
        input.addEventListener("input", () => {
            if (input.value.length === 1 && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }
        });

        input.addEventListener("keydown", (e) => {
            if (e.key === "Backspace" && !input.value && index > 0) {
                inputs[index - 1].focus();
            }
        });
    });

    // COMBINE OTP BEFORE SUBMIT
    function submitOtp() {
        let otp = "";
        inputs.forEach(i => otp += i.value);
        if (otp.length !== 6) {
            alert("Please enter the complete 6-digit OTP");
            return false;
        }
        otpHidden.value = otp;
        return true;
    }

    // TIMER (2 MINUTES)
    let timeLeft = 120;
    const timerEl = document.getElementById("time");
    const resendBtn = document.getElementById("resendBtn");

    const timer = setInterval(() => {
        let min = Math.floor(timeLeft / 60);
        let sec = timeLeft % 60;

        timerEl.textContent =
            String(min).padStart(2, "0") + ":" +
            String(sec).padStart(2, "0");

        timeLeft--;

        if (timeLeft < 0) {
            clearInterval(timer);
            resendBtn.disabled = false;
            timerEl.textContent = "00:00";
        }
    }, 1000);
</script>

</body>
</html>
