<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Upload Notes | Notora</title>

    <style>
        body{
            font-family:'Segoe UI',sans-serif;
            background:url('/images/background.png') no-repeat center center fixed;
            background-size:cover;
        }

        .container{
            max-width:600px;
            margin:60px auto;
            background:white;
            padding:35px;
            border-radius:24px;
            box-shadow:0 20px 50px rgba(0,0,0,.15);
        }

        h2{
            text-align:center;
            color:#f472b6;
        }

        input,select{
            width:100%;
            padding:12px;
            margin:10px 0;
            border-radius:12px;
            border:1px solid #fbcfe8;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:16px;
            background:linear-gradient(135deg,#f472b6,#fb7185);
            color:white;
            font-size:18px;
            font-weight:700;
            cursor:pointer;
        }

        .success{
            text-align:center;
            color:green;
            margin-bottom:15px;
            font-weight:600;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Upload Notes 📤</h2>

    <!-- ✅ ONE-TIME success -->
    <div th:if="${success}" class="success" id="successMsg">
        🎉 Note uploaded successfully! +10 ⭐ points
    </div>

    <form method="post" action="/upload-note" enctype="multipart/form-data">

        <input type="file" name="file" required
               accept=".pdf,.ppt,.pptx,.doc,.docx,.jpg,.png"/>

        <input type="text" name="subject" placeholder="Subject Name" required>
        <input type="text" name="department" placeholder="Department" required>

        <select name="semester" required>
            <option value="">Select Semester</option>
            <option>1</option><option>2</option><option>3</option>
            <option>4</option><option>5</option><option>6</option>
        </select>

        <input type="text" name="year" placeholder="Year" required>
        <input type="text" name="college" placeholder="College Name" required>

        <button id="uploadBtn">Upload Note</button>
    </form>
</div>

<script>
    const form = document.querySelector("form");
    const btn = document.getElementById("uploadBtn");

    form.addEventListener("submit", () => {
        btn.innerText = "Uploading...";
        btn.disabled = true;
    });

    // ✅ FIX browser back cache (KEY FIX)
    window.addEventListener("pageshow", function (event) {
        if (event.persisted) {
            const msg = document.getElementById("successMsg");
            if (msg) msg.remove(); // remove success + confetti
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<!-- ✅ Confetti ONLY once -->
<script th:if="${success}">
    confetti({
        particleCount: 150,
        spread: 70,
        origin: { y: 0.6 }
    });
</script>

</body>
</html>
