<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notora | Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #fadadd, #fdb7b9);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .wrapper {
            width: 95%;
            max-width: 1100px;
            height: 600px;
            background: white;
            border-radius: 28px;
            display: flex;
            box-shadow: 0 25px 60px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .left {
            flex: 1;
        }

        .left img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .right {
            flex: 1;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h2 {
            font-size: 34px;
            font-weight: 800;
            color: #3a2e39;
            margin-bottom: 8px;
        }

        p {
            color: #6b7280;
            margin-bottom: 20px;
        }

        /* 🔴 ERROR MESSAGE */
        .error {
            color: red;
            font-size: 14px;
            margin-bottom: 12px;
            min-height: 18px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            top: 50%;
            left: 18px;
            transform: translateY(-50%);
            color: #f472b6;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px 12px 35px;
            border-radius: 14px;
            border: 1.5px solid #fbcfe8;
            background: #fff7f3;
            font-size: 15px;
            outline: none;
        }

        .btn {
            margin-top: 10px;
            padding: 14px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #f472b6, #fb7185);
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 14px 35px rgba(244,114,182,0.45);
        }
    </style>
</head>

<body>

<div class="wrapper">

    <!-- LEFT IMAGE -->
    <div class="left">
        <img th:src="@{/images/admin.png}" alt="Admin">
    </div>

    <!-- RIGHT LOGIN -->
    <div class="right">

        <h2>Admin Login</h2>
        <p>Welcome back to Notora. Here's your dashboard.</p>

        <!-- 🔴 BACKEND / JS ERROR -->
        <div id="errorMsg" class="error" th:text="${error}"></div>

        <form action="/admin/login" method="post" onsubmit="return validateAdmin()">

            <div class="input-group">
                <i class="fa fa-envelope"></i>
                <input type="email" id="email" name="email" placeholder="Email Address">
            </div>

            <div class="input-group">
                <i class="fa fa-lock"></i>
                <input type="password" id="password" name="password" placeholder="Password">
            </div>

            <button class="btn" type="submit">Log In</button>
        </form>

    </div>
</div>

<script>
    function validateAdmin() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const error = document.getElementById("errorMsg");

        error.innerText = ""; // clear old error

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const passRegex = /^(?=.*[0-9])(?=.*[!@#$%^&*]).{8,}$/;

        if (!emailRegex.test(email)) {
            error.innerText = "Please enter a valid email address.";
            return false;
        }

        if (!passRegex.test(password)) {
            error.innerText =
                "Password must be at least 8 characters, include 1 number and 1 special character.";
            return false;
        }

        return true; // submit to backend
    }
</script>

</body>
</html>
